  <text x="600" y="490" text-anchor="middle" fill="#8888AA" font-family="Inter, sans-serif" font-weight="500" font-size="24" letter-spacing="0.1em" text-transform="uppercase">Digital Letter of Credit // On Stellar</text>

  <defs>
