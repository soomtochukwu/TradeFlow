  <circle cx="1000" cy="480" r="250" fill="#637FD6" fill-opacity="0.03" filter="url(#filter1_f)"/>

  <!-- Logo (Centered) -->
  <g transform="translate(540, 180) scale(4)">
    <path d="M16 2L4 7V15C4 21.6 9.1 27.7 16 30C22.9 27.7 28 21.6 28 15V7L16 2Z" stroke="#8E8FD8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
